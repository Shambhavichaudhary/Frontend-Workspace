<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
</head>
<body>
    <!-- Exerce-03 Problem -->
    <!-- assets is a folder which contains a card Image. Write html and css code to design this card. Use #html -->
     <!-- Solution -->

     <!-- Card Container -->
      <div class="card-container">

        <!-- Card Image -->
          <img src="https://thumbs.dreamstime.com/b/back-view-blonde-woman-cuddled-pink-blanket-looking-moranie-lake-canada-261075787.jpg" height="250" alt="">

         <!-- Card Content -->
          <div class="card-content">

            <!-- Tags -->
             <div class="tags">
                <ul>
                    <li>Nature</li>
                    <li>Lake</li>
                </ul>
             </div>

             <!-- Card Heading -->
              <h2>Lago di Braies</h2>

              <!-- Card Discription -->
               <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Voluptas porro, vero distinctio voluptatem deleniti debitis?</p>

               <!-- Read More Button -->
                <button>Read More</button>
          </div>
      </div>
</body>
</html>
